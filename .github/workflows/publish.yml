name: Build and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 21 * * *"   # 05:17 Taipei — refreshes the GitHub data
  workflow_dispatch:

# Build output is deployed as a Pages artifact, never committed back to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: node scripts/fetch-github.mjs

      - name: Build site
        run: node scripts/build.mjs

      - name: Collect publishable files into _site
        run: |
          mkdir _site
          cp -r index.html 404.html feed.xml sitemap.xml .nojekyll writing about assets _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
